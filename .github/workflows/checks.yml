name: specification checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fixtures:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_fixtures.py --check
      - run: python -m pip install -r requirements-normalization.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_normalization_fixtures.py --check

